version: '3.8'

services:
  # Node.js Express Backend Service
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: buildx-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/buildx
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production_super_secret_jwt_key_buildx_2026
    depends_on:
      - mongo
      - redis
    networks:
      - buildx-network

  # MongoDB NoSQL Database Service
  mongo:
    image: mongo:7.0
    container_name: buildx-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - buildx-network

  # Redis In-Memory Cache Service
  redis:
    image: redis:7-alpine
    container_name: buildx-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - buildx-network

networks:
  buildx-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:

